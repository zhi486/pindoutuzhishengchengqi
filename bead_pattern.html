<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拼豆图纸生成器</title>
<style>
:root {
  --bg: #f5f6f8; --card: #fff; --text: #222; --sub: #888;
  --accent: #3b82f6; --danger: #ef4444; --border: #e5e7eb;
  --grid-light: #ddd; --grid-emph: #444; --board: #5090d0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
.header { background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: center; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 18px; }

/* Layout */
.layout { display: flex; gap: 12px; padding: 12px; max-width: 1400px; margin: 0 auto; height: calc(100vh - 56px); }
.panel-left { flex: 3; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel-right { flex: 1; min-width: 260px; max-width: 320px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

/* Upload */
.upload-zone { border: 2px dashed var(--border); border-radius: 8px; text-align: center; padding: 20px; cursor: pointer; background: var(--card); transition: border-color .2s; }
.upload-zone:hover { border-color: var(--accent); }
.upload-zone p { color: var(--sub); font-size: 14px; }

/* Preview */
.preview-wrap { flex: 1; background: var(--card); border-radius: 8px; overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 300px; }
canvas#preview { image-rendering: pixelated; }

/* Card */
.card { background: var(--card); border-radius: 8px; padding: 14px; border: 1px solid var(--border); }
.card-title { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

/* Controls */
.control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.control-row label { font-size: 13px; width: 80px; flex-shrink: 0; }
.control-row input[type=range] { flex: 1; }
.control-row input[type=number] { width: 58px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-size: 13px; }
.control-row span { font-size: 12px; color: var(--sub); min-width: 30px; text-align: right; }

.check-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 13px; }

.btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .2s; }
.btn:active { opacity: .8; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; color: var(--sub); border: 1px solid var(--border); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Zoom */
.zoom-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.zoom-row button { width: 32px; height: 28px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: 16px; }

/* Legend */
.legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
.legend-swatch { width: 20px; height: 14px; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--border); }
.legend-code { font-weight: 600; min-width: 36px; }
.legend-count { color: var(--sub); margin-left: auto; }

.status { font-size: 12px; color: var(--sub); text-align: center; padding: 6px; }

@media (max-width: 768px) {
  .layout { flex-direction: column; height: auto; }
  .panel-right { max-width: none; }
  .preview-wrap { min-height: 250px; }
}
</style>
</head>
<body>
<div class="header"><h1>🎨 拼豆图纸生成器</h1></div>
<div class="layout">
  <!-- Left: Upload + Preview -->
  <div class="panel-left">
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <p>📷 点击或拖放选择图片</p>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <canvas id="preview"></canvas>
    </div>
    <div class="status" id="status">就绪</div>
  </div>

  <!-- Right: Controls -->
  <div class="panel-right">
    <div class="card">
      <div class="card-title">色卡模式</div>
      <div class="btn-row">
        <button class="btn btn-accent" id="btn291" onclick="switchPalette('291')" style="flex:1">291 色</button>
        <button class="btn" id="btn221" onclick="switchPalette('221')" style="flex:1;background:#6b7280;color:#fff">221 色</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">参数设置</div>
      <div class="control-row">
        <label>豆子长度</label>
        <input type="range" id="beadH" min="5" max="200" value="52" oninput="onBeadH(this.value)">
        <input type="number" id="beadHNum" min="5" max="200" value="52" onchange="onBeadH(this.value)">
        <span>行</span>
      </div>
      <div style="font-size:12px;color:var(--sub);margin:-4px 0 8px 88px" id="beadWInfo">宽度: — 列</div>
      <div class="control-row">
        <label>最大颜色数</label>
        <input type="range" id="maxColors" min="4" max="150" value="50" oninput="onMaxColors(this.value)">
        <input type="number" id="maxColorsNum" min="4" max="150" value="50" onchange="onMaxColors(this.value)">
      </div>
    </div>

    <div class="card">
      <div class="card-title">显示 & 底板</div>
      <div class="check-row"><input type="checkbox" id="showGrid" checked onchange="render()"> 显示网格线</div>
      <div class="check-row"><input type="checkbox" id="showBoard" checked onchange="render()"> 显示底板边界</div>
      <div class="check-row"><input type="checkbox" id="showCodes" checked onchange="render()"> 显示色号</div>
      <div class="control-row">
        <label>底板尺寸</label>
        <select id="boardSize" onchange="render()" style="padding:4px 8px;border-radius:4px;border:1px solid var(--border)">
          <option value="52">52×52</option>
          <option value="72">72×72</option>
          <option value="102">102×102</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-title">预览缩放</div>
      <div class="zoom-row">
        <button onclick="zoomOut()">−</button>
        <span id="zoomLabel" style="min-width:40px;text-align:center;font-weight:600;font-size:13px">20px</span>
        <button onclick="zoomIn()">+</button>
        <button onclick="zoomReset()" style="margin-left:auto;width:auto;padding:0 8px">↺</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">导出</div>
      <div class="btn-row">
        <button class="btn btn-accent" onclick="exportPNG()">导出 PNG</button>
        <button class="btn btn-danger" onclick="exportPDF()">导出 PDF</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">颜色图例</div>
      <div id="legend" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

// Precompute LAB values for palette
let PALETTE_LAB = PALETTE.map(c => rgbToLab(c.rgb));
let PALETTE_221_LAB = null;
let paletteMode = '291';
let activePalette = PALETTE;
let activePaletteLAB = PALETTE_LAB;

function switchPalette(mode) {

  if (mode === '221') {
    if (!PALETTE_221_LAB) PALETTE_221_LAB = PALETTE_221.map(c => rgbToLab(c.rgb));

  } else {

  }

// ==================== Color Space ====================
function rgbToLab([r,g,b]) {
  let rr = r/255, gg = g/255, bb = b/255;
  rr = rr > 0.04045 ? Math.pow((rr+0.055)/1.055, 2.4) : rr/12.92;
  gg = gg > 0.04045 ? Math.pow((gg+0.055)/1.055, 2.4) : gg/12.92;
  bb = bb > 0.04045 ? Math.pow((bb+0.055)/1.055, 2.4) : bb/12.92;
  let x = (rr*0.4124564 + gg*0.3575761 + bb*0.1804375) / 0.95047;
  let y = (rr*0.2126729 + gg*0.7151522 + bb*0.0721750) / 1.0;
  let z = (rr*0.0193339 + gg*0.1191920 + bb*0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787*t + 16/116;
  let L = 116*f(y) - 16;
  let a = 500*(f(x)-f(y));
  let bv = 200*(f(y)-f(z));
  return [L, a, bv];
}

function deltaE(l1, l2) {
  let dL=l1[0]-l2[0], da=l1[1]-l2[1], db=l1[2]-l2[2];
  return Math.sqrt(dL*dL + da*da + db*db);
}

function findNearestColor(rgb) {
  let lab = rgbToLab(rgb);
  let bestI = 0, bestD = Infinity;
  for (let i = 0; i < activePaletteLAB.length; i++) {
    let d = deltaE(lab, activePaletteLAB[i]);
    if (d < bestD) { bestD = d; bestI = i; }
  }
  return { index: bestI, code: activePalette[bestI].code, hex: activePalette[bestI].hex, rgb: activePalette[bestI].rgb };
}

// ==================== Median Cut ====================
function medianCut(pixels, k) {
  if (pixels.length <= k) return pixels;
  let boxes = [{ data: pixels, rMin:0,rMax:255,gMin:0,gMax:255,bMin:0,bMax:255 }];
  while (boxes.length < k) {
    let bestI = 0, bestVol = -1;
    for (let i = 0; i < boxes.length; i++) {
      let b = boxes[i];
      let vol = (b.rMax-b.rMin+1)*(b.gMax-b.gMin+1)*(b.bMax-b.bMin+1);
      if (vol > bestVol) { bestVol = vol; bestI = i; }
    }
    let box = boxes[bestI];
    let rngR = box.rMax-box.rMin, rngG = box.gMax-box.gMin, rngB = box.bMax-box.bMin;
    let ch = rngR >= rngG && rngR >= rngB ? 0 : (rngG >= rngB ? 1 : 2);
    box.data.sort((a,b) => a[ch]-b[ch]);
    let mid = box.data.length >> 1;
    if (mid === 0) break;
    let left = box.data.slice(0, mid), right = box.data.slice(mid);
    boxes[bestI] = { data: left, rMin:Math.min(...left.map(p=>p[0])), rMax:Math.max(...left.map(p=>p[0])), gMin:Math.min(...left.map(p=>p[1])), gMax:Math.max(...left.map(p=>p[1])), bMin:Math.min(...left.map(p=>p[2])), bMax:Math.max(...left.map(p=>p[2])) };
    boxes.push({ data: right, rMin:Math.min(...right.map(p=>p[0])), rMax:Math.max(...right.map(p=>p[0])), gMin:Math.min(...right.map(p=>p[1])), gMax:Math.max(...right.map(p=>p[1])), bMin:Math.min(...right.map(p=>p[2])), bMax:Math.max(...right.map(p=>p[2])) });
  }
  return boxes.map(b => { let s=b.data.reduce((a,p)=>[a[0]+p[0],a[1]+p[1],a[2]+p[2]],[0,0,0]); let n=b.data.length; return [Math.round(s[0]/n),Math.round(s[1]/n),Math.round(s[2]/n)]; });
}

function quantize(grid, maxColors) {
  let pixels = []; for (let r=0; r<grid.length; r++) for (let c=0; c<grid[0].length; c++) pixels.push([...grid[r][c]]);
  let uniq = new Set(pixels.map(p=>p.join(',')));
  if (uniq.size <= maxColors) return grid;
  let palette = medianCut(pixels, maxColors);
  let out = [];
  for (let r=0; r<grid.length; r++) {
    out[r] = [];
    for (let c=0; c<grid[0].length; c++) {
      let p = grid[r][c], bestI = 0, bestD = Infinity;
      for (let i=0; i<palette.length; i++) {
        let dr=p[0]-palette[i][0], dg=p[1]-palette[i][1], db=p[2]-palette[i][2];
        let d = dr*dr+dg*dg+db*db;
        if (d < bestD) { bestD=d; bestI=i; }
      }
      out[r][c] = palette[bestI];
    }
  }
  return out;
}

// ==================== State ====================
let imgOriginal = null, patternGrid = null, patternIdx = null;
let tileSize = 20, beadH = 52;

const ZOOM_LEVELS = [5,8,10,12,15,18,20,25,30,40,50];

// ==================== Image Loading ====================
document.getElementById('fileInput').addEventListener('change', e => {
  let f = e.target.files[0];
  if (!f) return;
  let img = new Image();
  img.onload = () => { imgOriginal = img; process(); };
  img.src = URL.createObjectURL(f);
});

const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', e => { e.preventDefault(); });
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  let f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) {
    let img = new Image();
    img.onload = () => { imgOriginal = img; process(); };
    img.src = URL.createObjectURL(f);
  }
});

// ==================== Processing ====================
function process() {
  if (!imgOriginal) return;
  let maxColors = parseInt(document.getElementById('maxColors').value);
  beadH = parseInt(document.getElementById('beadH').value);
  let beadW = Math.max(1, Math.round(imgOriginal.width / imgOriginal.height * beadH));
  document.getElementById('beadWInfo').textContent = `宽度: ${beadW} 列`;

  let canvas = document.createElement('canvas');
  canvas.width = beadW; canvas.height = beadH;
  let ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(imgOriginal, 0, 0, beadW, beadH);
  let data = ctx.getImageData(0, 0, beadW, beadH).data;

  // Build color grid
  let grid = [];
  for (let r=0; r<beadH; r++) {
    grid[r] = [];
    for (let c=0; c<beadW; c++) {
      let i = (r*beadW + c)*4;
      grid[r][c] = [data[i], data[i+1], data[i+2]];
    }
  }

  // Quantize
  grid = quantize(grid, maxColors);

  // Match to bead palette
  let matched = [], indices = [];
  let counts = {};
  for (let r=0; r<beadH; r++) {
    matched[r] = []; indices[r] = [];
    for (let c=0; c<beadW; c++) {
      let nearest = findNearestColor(grid[r][c]);
      matched[r][c] = nearest.rgb;
      indices[r][c] = nearest.index;
      counts[nearest.code] = (counts[nearest.code]||0) + 1;
    }
  }

  patternGrid = matched;
  patternIdx = indices;

  // Update legend
  let sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  let total = sorted.reduce((s,e)=>s+e[1], 0);
  let legendHtml = '';
  for (let [code, cnt] of sorted) {
    let p = activePalette.find(c=>c.code===code);
    legendHtml += `<div class="legend-item"><div class="legend-swatch" style="background:${p.hex}"></div><span class="legend-code">${code}</span><span class="legend-count">${cnt}颗</span></div>`;
  }
  legendHtml += `<div style="margin-top:8px;font-weight:600;font-size:12px">共 ${sorted.length} 色，${total} 颗</div>`;
  document.getElementById('legend').innerHTML = legendHtml;

  document.getElementById('status').textContent = `${beadW}×${beadH} 豆子 | ${paletteMode}色卡 | ${sorted.length} 种颜色 | 共 ${total} 颗`;
  render();
}

// ==================== Rendering ====================
function render() {
  if (!patternGrid) return;
  let beadW = patternGrid[0].length, beadH = patternGrid.length;
  let showGrid = document.getElementById('showGrid').checked;
  let showBoard = document.getElementById('showBoard').checked;
  let boardSize = parseInt(document.getElementById('boardSize').value);

  // Canvas
  let canvas = document.getElementById('preview');
  let marginLeft = 30, marginTop = 24;
  canvas.width = beadW * tileSize + marginLeft;
  canvas.height = beadH * tileSize + marginTop;
  let ctx = canvas.getContext('2d');

  // Fill background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw pixels
  for (let r=0; r<beadH; r++) {
    for (let c=0; c<beadW; c++) {
      let [rr,gg,bb] = patternGrid[r][c];
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.fillRect(marginLeft + c*tileSize, marginTop + r*tileSize, tileSize, tileSize);
    }
  }

  // Grid lines
  if (showGrid) {
    for (let y=0; y<=beadH; y++) {
      let isEmph = y%5===0;
      let color = isEmph ? '#444' : '#ddd';
      let lw = isEmph ? 2 : 1;
      for (let dy=0; dy<lw; dy++) {
        let py = marginTop + y*tileSize + dy;
        if (py >= marginTop && py < marginTop+beadH*tileSize) {
          ctx.fillStyle = color;
          ctx.fillRect(marginLeft, py, beadW*tileSize, 1);
        }
      }
    }
    for (let x=0; x<=beadW; x++) {
      let isEmph = x%5===0;
      let color = isEmph ? '#444' : '#ddd';
      let lw = isEmph ? 2 : 1;
      for (let dx=0; dx<lw; dx++) {
        let px = marginLeft + x*tileSize + dx;
        if (px >= marginLeft && px < marginLeft+beadW*tileSize) {
          ctx.fillStyle = color;
          ctx.fillRect(px, marginTop, 1, beadH*tileSize);
        }
      }
    }
    // Cross-point gaps
    for (let y=0; y<=beadH; y++) {
      for (let x=0; x<=beadW; x++) {
        if (y<beadH && x<beadW) {
          let hEmph = y%5===0, vEmph = x%5===0;
          let gap = Math.max(hEmph?2:1, vEmph?2:1);
          let [rr,gg,bb] = patternGrid[y][x];
          ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
          ctx.fillRect(marginLeft + x*tileSize, marginTop + y*tileSize, gap, gap);
        }
      }
    }
  }

  // Board lines
  if (showGrid && showBoard) {
    for (let y=boardSize; y<beadH; y+=boardSize) {
      ctx.fillStyle = '#5090d0';
      ctx.fillRect(marginLeft, marginTop + y*tileSize, beadW*tileSize, 1);
    }
    for (let x=boardSize; x<beadW; x+=boardSize) {
      ctx.fillStyle = '#5090d0';
      ctx.fillRect(marginLeft + x*tileSize, marginTop, 1, beadH*tileSize);
    }
  }

  // Color codes
  if (document.getElementById('showCodes').checked && tileSize >= 10) {
    let fontSize = Math.max(7, Math.round(tileSize * 0.45));
    ctx.font = `${fontSize}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let r=0; r<beadH; r++) {
      for (let c=0; c<beadW; c++) {
        let code = activePalette[patternIdx[r][c]].code;
        let [rr,gg,bb] = patternGrid[r][c];
        let lum = 0.299*rr + 0.587*gg + 0.114*bb;
        ctx.fillStyle = lum > 128 ? '#000' : '#fff';
        ctx.fillText(code, marginLeft + c*tileSize + tileSize/2, marginTop + r*tileSize + tileSize/2);
      }
    }
  }

  // Coordinate labels
  let interval = Math.max(beadW,beadH) < 30 ? 1 : 5;
  ctx.fillStyle = '#666';
  ctx.font = `${Math.max(9, tileSize-4)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  for (let c=0; c<beadW; c+=interval) {
    ctx.fillText(String(c+1), marginLeft + c*tileSize + tileSize/2, marginTop - 6);
  }
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let r=0; r<beadH; r+=interval) {
    ctx.fillText(String(r+1), marginLeft - 4, marginTop + r*tileSize + tileSize/2);
  }
  ctx.textBaseline = 'alphabetic';
}

// ==================== Controls ====================
function onBeadH(v) {
  v = parseInt(v);
  document.getElementById('beadH').value = v;
  document.getElementById('beadHNum').value = v;
  process();
}
function onMaxColors(v) {
  v = parseInt(v);
  document.getElementById('maxColors').value = v;
  document.getElementById('maxColorsNum').value = v;
  process();
}
function zoomIn() {
  let cur = tileSize;
  for (let z of ZOOM_LEVELS) { if (z>cur) { tileSize=z; break; } }
  if (tileSize===cur) tileSize = Math.min(cur+10, 50);
  document.getElementById('zoomLabel').textContent = tileSize + 'px';
  render();
}
function zoomOut() {
  let cur = tileSize;
  for (let i=ZOOM_LEVELS.length-1; i>=0; i--) { if (ZOOM_LEVELS[i]<cur) { tileSize=ZOOM_LEVELS[i]; break; } }
  if (tileSize===cur) tileSize = Math.max(cur-10, 3);
  document.getElementById('zoomLabel').textContent = tileSize + 'px';
  render();
}
function zoomReset() {
  tileSize = 20;
  document.getElementById('zoomLabel').textContent = '20px';
  render();
}

function exportPDF() {
  if (!patternGrid) return;
  let beadW = patternGrid[0].length, beadH = patternGrid.length;
  let boardSize = parseInt(document.getElementById('boardSize').value);
  let { jsPDF } = window.jspdf;
  let doc = new jsPDF('p', 'mm', 'a4');
  let pageW = 210, pageH = 297, margin = 15;
  let usableW = pageW - 2*margin, usableH = pageH - 2*margin - 15;
  let cellMM = Math.min(usableW/boardSize, usableH/boardSize);

  let boardCols = Math.ceil(beadW/boardSize);
  let boardRows = Math.ceil(beadH/boardSize);

  for (let br=0; br<boardRows; br++) {
    for (let bc=0; bc<boardCols; bc++) {
      let r0=br*boardSize, r1=Math.min(r0+boardSize, beadH);
      let c0=bc*boardSize, c1=Math.min(c0+boardSize, beadW);
      let bw = c1-c0, bh = r1-r0;

      // Title
      doc.setFontSize(9);
      doc.text(`底板 ${br*boardCols+bc+1}/${boardRows*boardCols}  ${bw}×${bh}`, margin, margin+4);

      // Draw cells
      let colors = {};
      for (let r=r0; r<r1; r++) {
        for (let c=c0; c<c1; c++) {
          let idx = patternIdx[r][c];
          if (!colors[idx]) colors[idx] = [];
          colors[idx].push({c:c-c0, r:r-r0});
        }
      }
      for (let [idx, cells] of Object.entries(colors)) {
        let hex = activePalette[parseInt(idx)].hex;
        let rr=parseInt(hex.slice(1,3),16)/255, gg=parseInt(hex.slice(3,5),16)/255, bb=parseInt(hex.slice(5,7),16)/255;
        doc.setFillColor(rr*255, gg*255, bb*255);
        doc.setDrawColor(200,200,200);
        doc.setLineWidth(0.1);
        for (let {c,r} of cells) {
          let x = margin + 12 + c*cellMM;
          let y = margin + 6 + (bh-1-r)*cellMM;
          doc.rect(x, y, cellMM, cellMM, 'FD');
        }
      }

      // Border
      doc.setDrawColor(0);
      doc.setLineWidth(0.5);
      doc.rect(margin+12, margin+6, bw*cellMM, bh*cellMM);

      // Labels
      doc.setFontSize(5);
      doc.setTextColor(100,100,100);
      let interval = Math.max(bw,bh)<=30?1:5;
      for (let r=0; r<bh; r+=interval) {
        doc.text(String(r+r0+1), margin+2, margin+6+(bh-1-r)*cellMM+cellMM/2+1);
      }
      for (let c=0; c<bw; c+=interval) {
        doc.text(String(c+c0+1), margin+12+c*cellMM+cellMM/2, margin+4);
      }

      if (br<boardRows-1 || bc<boardCols-1) doc.addPage();
    }
  }

  // Legend page
  doc.addPage();
  let y = margin;
  doc.setFontSize(14);
  doc.setTextColor(0,0,0);
  doc.text('颜色图例', margin, y);
  y += 10;
  let totals = {};
  for (let r=0; r<beadH; r++) for (let c=0; c<beadW; c++) {
    let code = activePalette[patternIdx[r][c]].code;
    totals[code] = (totals[code]||0)+1;
  }
  let sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  doc.setFontSize(9);
  for (let [code, count] of sorted) {
    if (y > 280) { doc.addPage(); y = margin; }
    let p = activePalette.find(c=>c.code===code);
    doc.setFillColor(p.rgb[0],p.rgb[1],p.rgb[2]);
    doc.setDrawColor(180,180,180);
    doc.rect(margin, y-4, 6, 6, 'FD');
    doc.text(`${code}    ${count}颗`, margin+8, y);
    y += 7;
  }

  doc.save('pixel_bead_pattern.pdf');
}
</script>

</html>
